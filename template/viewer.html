<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--> · Patent Drawing</title>
<style>
  :root { --desk: #d9d4c9; --bar: rgba(250, 248, 243, .86); --text: #1d1b17; --muted: #6d675c; --line: rgba(0,0,0,.12); --accent: #1d1b17; }
  @media (prefers-color-scheme: dark) { :root { --desk: #1b1a18; --bar: rgba(30, 29, 27, .86); --text: #ece8df; --muted: #9b958a; --line: rgba(255,255,255,.12); --accent: #ece8df; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--desk); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 10; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 10px 16px; background: var(--bar); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
  }
  header h1 { font: italic 600 17px/1.2 "Times New Roman", Times, serif; margin: 0; flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button, .btn { font: inherit; font-size: 13px; padding: 6px 12px; border: 0; background: transparent; color: var(--text); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--desk); }
  .btn { border: 1px solid var(--line); border-radius: 8px; }
  .btn:hover, .seg button:hover:not([aria-pressed="true"]) { background: var(--line); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { display: grid; gap: 28px; justify-items: center; padding: 28px 16px 60px; }
  .sheet { width: min(850px, 100%); aspect-ratio: 850 / 1100; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 18px 40px -18px rgba(0,0,0,.45); }
  .sheet { position: relative; }
  .sheet svg { width: 100%; height: 100%; display: block; }
  /* In the page, grain is a tiled image (light in a PDF); the SVG's own noise filter is for standalone files. */
  .sheet .pd.vintage .grain { display: none; }
  [data-theme="vintage"] .sheet::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: url("/*__GRAIN__*/") repeat; background-size: 64px 64px; }
  .tip {
    position: fixed; z-index: 20; pointer-events: none; padding: 5px 9px; border-radius: 6px; font-size: 13px;
    background: #1d1b17; color: #f4f1ea; transform: translate(-50%, -130%); opacity: 0; transition: opacity .12s;
  }
  .tip.on { opacity: 1; }
  .label, .ref, [data-n] { cursor: default; }
  .export header, .export .tip { display: none; }
  .export body { background: transparent; }
  .export main { padding: 0; gap: 0; }
  .export .sheet { width: 100vw; height: 100vh; box-shadow: none; }
  .export .sheet:not(.only) { display: none; }
  @media print {
    @page { size: 8.5in 11in; margin: 0; }
    header, .tip { display: none; }
    body { background: none; }
    main { padding: 0; gap: 0; display: block; }
    .sheet { width: 8.5in; height: 11in; box-shadow: none; break-after: page; page-break-after: always; }
  }
</style>
</head>
<body>
<header>
  <h1><!--TITLE--></h1>
  <div class="seg" role="group" aria-label="Paper style">
    <button data-theme="classic">Classic</button><button data-theme="vintage">Vintage</button><button data-theme="blueprint">Blueprint</button>
  </div>
  <button class="btn" id="print">Print / PDF</button>
</header>
<main>
<!--SHEETS-->
</main>
<div class="tip" id="tip" role="status"></div>
<script>
const META = /*__META__*/null;
const names = new Map(META.numerals);
const params = new URLSearchParams(location.hash.slice(1));
const svgs = [...document.querySelectorAll(".sheet svg")];

function setTheme(t) {
  for (const s of svgs) { s.classList.remove("classic", "vintage", "blueprint"); s.classList.add(t); }
  document.body.dataset.theme = t;
  for (const b of document.querySelectorAll("[data-theme]")) b.setAttribute("aria-pressed", String(b.dataset.theme === t));
  try { localStorage.setItem("pd-theme", t); } catch {}
}
let saved = null;
try { saved = localStorage.getItem("pd-theme"); } catch {}
setTheme(params.get("theme") || saved || META.theme);
for (const b of document.querySelectorAll("[data-theme]")) b.addEventListener("click", () => setTheme(b.dataset.theme));
document.getElementById("print").addEventListener("click", () => print());

if (params.has("export")) {
  document.documentElement.classList.add("export");
  const n = +(params.get("sheet") || 1);
  document.getElementById("sheet-" + n)?.classList.add("only");
}

// Hovering a numeral (on a drawing or in the reference list) lights up every part with that number.
const tip = document.getElementById("tip");
let current = null;
function light(n, e) {
  if (n === current) { if (e) move(e); return; }
  current = n;
  for (const el of document.querySelectorAll(".hl")) el.classList.remove("hl");
  if (n == null) { tip.classList.remove("on"); return; }
  for (const el of document.querySelectorAll(`[data-n="${CSS.escape(n)}"]`)) el.classList.add("hl");
  const name = names.get(n);
  tip.textContent = name ? `${n} · ${name}` : n;
  tip.classList.add("on");
  if (e) move(e);
}
const move = (e) => { tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; };
document.addEventListener("pointermove", (e) => {
  const t = e.target.closest?.(".label, .ref, [data-n]");
  light(t ? t.dataset.n : null, e);
});
</script>
</body>
</html>
