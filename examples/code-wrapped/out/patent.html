<title>System and method for rendering a version-control history as a narrative story · Patent Drawing</title>
<style>
  :root { --desk: #d9d4c9; --bar: rgba(250, 248, 243, .86); --text: #1d1b17; --muted: #6d675c; --line: rgba(0,0,0,.12); --accent: #1d1b17; }
  @media (prefers-color-scheme: dark) { :root { --desk: #1b1a18; --bar: rgba(30, 29, 27, .86); --text: #ece8df; --muted: #9b958a; --line: rgba(255,255,255,.12); --accent: #ece8df; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--desk); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 10; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 10px 16px; background: var(--bar); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
  }
  header h1 { font: italic 600 17px/1.2 "Times New Roman", Times, serif; margin: 0; flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button, .btn { font: inherit; font-size: 13px; padding: 6px 12px; border: 0; background: transparent; color: var(--text); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--desk); }
  .btn { border: 1px solid var(--line); border-radius: 8px; }
  .btn:hover, .seg button:hover:not([aria-pressed="true"]) { background: var(--line); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { display: grid; gap: 28px; justify-items: center; padding: 28px 16px 60px; }
  .sheet { width: min(850px, 100%); aspect-ratio: 850 / 1100; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 18px 40px -18px rgba(0,0,0,.45); }

  .sheet svg { width: 100%; height: 100%; display: block; }

erif abstract" x="425" y="172" font-size="13.2"><tspan x="425" dy="0">A collector (110) reads commit records from one or</tspan><tspan x="425" dy="18">more repositories (102) and computes a set of</tspan><tspan x="425" dy="18">statistics (112), including activity rhythm, streaks</tspan><tspan x="425" dy="18">and a personality archetype. A language model (120)</tspan><tspan x="425" dy="18">writes captions grounded in those statistics, and a</tspan><tspan x="425" dy="18">builder (130) renders a sequence of story cards</tspan><tspan x="425" dy="18">(210) for display on a handheld device (200). An</tspan><tspan x="425" dy="18">exporter (140) produces still images and a video</tspan><tspan x="425" dy="18">suitable for sharing. Quoted commit text is screened</tspan><tspan x="425" dy="18">before export.</tspan></text><g class="figure" data-fig="1"><g data-n="220"><path class="paper" d="M501.39 807.4 L603.51 796.4 L679.3 837.58 L577.17 848.58Z"/><path class="s none" d="M501.39 807.4 L603.51 796.4 L679.3 837.58 L577.17 848.58Z"/><path class="paper" d="M481.93 850.82 L501.39 807.4 L577.17 848.58 L557.72 892Z"/><path class="s none" d="M481.93 850.82 L501.39 807.4 L577.17 848.58 L557.72 892Z"/><path class="paper" d="M723.07 874.19 L557.72 892 L577.17 848.58 L679.3 837.58Z"/><clipPath id="fpc0"><path d="M723.07 874.19 L557.72 892 L577.17 848.58 L679.3 837.58Z"/></clipPath><path class="hatch" clip-path="url(#fpc0)" d="M418.58 857.6 L855.58 810.53M419.65 867.54 L856.65 820.47M420.72 877.48 L857.72 830.41M421.79 887.43 L858.8 840.36M422.86 897.37 L859.87 850.3M423.93 907.31 L860.94 860.24M425.01 917.25 L862.01 870.18"/><path class="s none" d="M723.07 874.19 L557.72 892 L577.17 848.58 L679.3 837.58Z"/></g><g data-n="204"><path class="paper" d="M683.43 549.86 L673.69 544.57 L673.69 498.08 L683.43 503.38Z"/><path class="s none" d="M683.43 549.86 L673.69 544.57 L673.69 498.08 L683.43 503.38Z"/><path class="paper" d="M680.99 497.3 L690.73 502.59 L683.43 503.38 L673.69 498.08Z"/><path cl const names = new Map(META.numerals);
const params = new URLSearchParams(location.hash.slice(1));
const svgs = [...document.querySelectorAll(".sheet svg")];

function setTheme(t) {
  for (const s of svgs) { s.classList.remove("classic", "vintage", "blueprint"); s.classList.add(t); }
  document.body.dataset.theme = t;
  for (const b of document.querySelectorAll("[data-theme]")) b.setAttribute("aria-pressed", String(b.dataset.theme === t));
  try { localStorage.setItem("pd-theme", t); } catch {}
}
let saved = null;
try { saved = localStorage.getItem("pd-theme"); } catch {}
setTheme(params.get("theme") || saved || META.theme);
for (const b of document.querySelectorAll("[data-theme]")) b.addEventListener("click", () => setTheme(b.dataset.theme));
document.getElementById("print").addEventListener("click", () => print());

if (params.has("export")) {
  document.documentElement.classList.add("export");
  const n = +(params.get("sheet") || 1);
  document.getElementById("sheet-" + n)?.classList.add("only");
}

// Hovering a numeral (on a drawing or in the reference list) lights up every part with that number.
const tip = document.getElementById("tip");
let current = null;

  if (n === current) { if (e) move(e); return; }
  current = n;
  for (const el of document.querySelectorAll(".hl")) el.classList.remove("hl");
  if (n == null) { tip.classList.remove("on"); return; }
  for (const el of document.querySelectorAll(`[data-n="${CSS.escape(n)}"]`)) el.classList.add("hl");
  const name = names.get(n);
  tip.textContent = name ? `${n} · ${name}` : n;
  tip.classList.add("on");
  if (e) move(e);
}
const move = (e) => { tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; };
document.addEventListener("pointermove", (e) => {
  const t = e.target.closest?.(".label, .ref, [data-n]");
  light(t ? t.dataset.n : null, e);
});
</script>
</body>
</html>
