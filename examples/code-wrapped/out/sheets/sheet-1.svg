<text class="serif" x="60" y="70" font-size="13">(12) <tspan font-size="24" font-weight="bold" dx="6">Patent Drawing</tspan></text><text class="serif" x="790" y="64" font-size="13" text-anchor="end">(45) Date: <tspan font-weight="bold">Nov. 1, 2026</tspan></text><text class="serif" x="90" y="96" font-size="15">Rivera</text><path class="s none" d="M60 112 H790"/><path class="s none thin" d="M60 116 H790"/><text class="serif" x="60" y="146" font-size="13">(54)</text><text class="serif" x="94" y="146" font-size="13">Title:</text><text class="serif" x="94" y="164" font-size="15" font-weight="bold"><tspan x="94" dy="0">SYSTEM AND METHOD FOR</tspan><tspan x="94" dy="19">RENDERING A VERSION-CONTROL</tspan><tspan x="94" dy="19">HISTORY AS A NARRATIVE STORY</tspan></text><text class="serif" x="60" y="235" font-size="13">(72)</text><text class="serif" x="94" y="235" font-size="13">Inventor:</text><text class="serif" x="94" y="253" font-size="13" ><tspan x="94" dy="0">Alex Rivera</tspan></text><text class="serif" x="60" y="283" font-size="13">(51)</text><text class="serif" x="94" y="283" font-size="13">Field:</text><text class="serif" x="94" y="301" font-size="13" ><tspan x="94" dy="0">Developer tools; data storytelling</tspan></text><text class="serif" x="60" y="331" font-size="13">(58)</text><text class="serif" x="94" y="331" font-size="13">Drawings:</text><text class="serif" x="94" y="349" font-size="13" ><tspan x="94" dy="0">3 figures on 3 sheets</tspan></text><text class="serif" x="60" y="385" font-size="13" letter-spacing="1.5">REFERENCE NUMERALS</text><path class="s none thin" d="M60 393 H375"/><g class="ref" data-n="100"><text class="num" x="86" y="413" text-anchor="end" font-size="12.5">100</text><text class="serif" x="96" y="413" font-size="12.5">Story system</text></g><g class="ref" data-n="102"><text class="num" x="86" y="430.5" text-anchor="end" font-size="12.5">102</text><text class="serif" x="96" y="430.5" font-size="12.5">Repositories</text></g><g class="ref" data-n="110"><text class="num" x="86" y="448" text-anchor="end" font-size="12.5">110</text><text class="serif" x="96" y="448" font-size="12.5">Collector</text></g><g class="ref" data-n="112"><text class="num" x="86" y="465.5" text-anchor="end" font-size="12.5">112</text><text class="serif" x="96" y="465.5" font-size="12.5">Statistics</text></g><g class="ref" data-n="120"><text class="num" x="86" y="483" text-anchor="end" font-size="12.5">120</text><text class="serif" x="96" y="483" font-size="12.5">Language model caption writer</text></g><g class="ref" data-n="122"><text class="num" x="86" y="500.5" text-anchor="end" font-size="12.5">122</text><text class="serif" x="96" y="500.5" font-size="12.5">Privacy screen</text></g><g class="ref" data-n="130"><text class="num" x="86" y="518" text-anchor="end" font-size="12.5">130</text><text class="serif" x="96" y="518" font-size="12.5">Story builder</text></g><g class="ref" data-n="140"><text class="num" x="86" y="535.5" text-anchor="end" font-size="12.5">140</text><text class="serif" x="96" y="535.5" font-size="12.5">Exporter</text></g><g class="ref" data-n="150"><text class="num" x="86" y="553" text-anchor="end" font-size="12.5">150</text><text class="serif" x="96" y="553" font-size="12.5">Images and video</text></g><g class="ref" data-n="200"><text class="num" x="86" y="570.5" text-anchor="end" font-size="12.5">200</text><text class="serif" x="96" y="570.5" font-size="12.5">Handheld device</text></g><g class="ref" data-n="204"><text class="num" x="86" y="588" text-anchor="end" font-size="12.5">204</text><text class="serif" x="96" y="588" font-size="12.5">Side button</text></g><g class="ref" data-n="210"><text class="num" x="86" y="605.5" text-anchor="end" font-size="12.5">210</text><text class="serif" x="96" y="605.5" font-size="12.5">Story card</text></g><g class="ref" data-n="212"><text class="num" x="86" y="623" text-anchor="end" font-size="12.5">212</text><text class="serif" x="96" y="623" font-size="12.5">Progress indicator</text></g><g class="ref" data-n="214"><text class="num" x="86" y="640.5" text-anchor="end" font-size="12.5">214</text><text class="serif" x="96" y="640.5" font-size="12.5">Activity chart</text></g><g class="ref" data-n="220"><text class="num" x="86" y="658" text-anchor="end" font-size="12.5">220</text><text class="serif" x="96" y="658" font-size="12.5">Dock</text></g><g class="ref" data-n="302"><text class="num" x="86" y="675.5" text-anchor="end" font-size="12.5">302</text><text class="serif" x="96" y="675.5" font-size="12.5">Read commit records for an author and…</text></g><g class="ref" data-n="304"><text class="num" x="86" y="693" text-anchor="end" font-size="12.5">304</text><text class="serif" x="96" y="693" font-size="12.5">Compute rhythm, streak, languages and…</text></g><g class="ref" data-n="306"><text class="num" x="86" y="710.5" text-anchor="end" font-size="12.5">306</text><text class="serif" x="96" y="710.5" font-size="12.5">Generate captions from the statistics</text></g><g class="ref" data-n="308"><text class="num" x="86" y="728" text-anchor="end" font-size="12.5">308</text><text class="serif" x="96" y="728" font-size="12.5">Every number found in the statistics?</text></g><g class="ref" data-n="310"><text class="num" x="86" y="745.5" text-anchor="end" font-size="12.5">310</text><text class="serif" x="96" y="745.5" font-size="12.5">Quoted text safe to share?</text></g><g class="ref" data-n="312"><text class="num" x="86" y="763" text-anchor="end" font-size="12.5">312</text><text class="serif" x="96" y="763" font-size="12.5">Remove card or ask the author</text></g><g class="ref" data-n="314"><text class="num" x="86" y="780.5" text-anchor="end" font-size="12.5">314</text><text class="serif" x="96" y="780.5" font-size="12.5">Render story cards, images and video</text></g><text class="serif" x="425" y="146" font-size="13">(57)</text><text class="serif" x="619.5" y="146" font-size="14" text-anchor="middle" letter-spacing="2">ABSTRACT</text><text class="serif abstract" x="425" y="172" font-size="13.2"><tspan x="425" dy="0">A collector (110) reads commit records from one or</tspan><tspan x="425" dy="18">more repositories (102) and computes a set of</tspan><tspan x="425" dy="18">statistics (112), including activity rhythm, streaks</tspan><tspan x="425" dy="18">and a personality archetype. A language model (120)</tspan><tspan x="425" dy="18">writes captions grounded in those statistics, and a</tspan><tspan x="425" dy="18">builder (130) renders a sequence of story cards</tspan><tspan x="425" dy="18">(210) for display on a handheld device (200). An</tspan><tspan x="425" dy="18">exporter (140) produces still images and a video</tspan><tspan x="425" dy="18">suitable for sharing. Quoted commit text is screened</tspan><tspan x="425" dy="18">before export.</tspan></text><g class="figure" data-fig="1"><g data-n="220"><path class="paper" d="M501.39 807.4 L603.51 796.4 L679.3 837.58 L577.17 848.58Z"/><path class="s none" d="M501.39 807.4 L603.51 796.4 L679.3 837.58 L577.17 848.58Z"/><path class="paper" d="M481.93 850.82 L501.39 807.4 L577.17 848.58 L557.72 892Z"/><path class="s none" d="M481.93 850.82 L501.39 807.4 L577.17 848.58 L557.72 892Z"/><path class="paper" d="M723.07 874.19 L557.72 892 L577.17 848.58 L679.3 837.58Z"/><clipPath id="fpc0"><path d="M723.07 874.19 L557.72 892 L577.17 848.58 L679.3 837.58Z"/></clipPath><path class="hatch" clip-path="url(#fpc0)" d="M418.58 857.6 L855.58 810.53M419.65 867.54 L856.65 820.47M420.72 877.48 L857.72 830.41M421.79 887.43 L858.8 840.36M422.86 897.37 L859.87 850.3M423.93 907.31 L860.94 860.24M425.01 917.25 L862.01 870.18"/><path class="s none" d="M723.07 874.19 L557.72 892 L577.17 848.58 L679.3 837.58Z"/></g><g data-n="204"><path class="paper" d="M683.43 549.86 L673.69 544.57 L673.69 498.08 L683.43 503.38Z"/><path class="s none" d="M683.43 549.86 L673.69 544.57 L673.69 498.08 L683.43 503.38Z"/><path class="paper" d="M680.99 497.3 L690.73 502.59 L683.43 503.38 L673.69 498.08Z"/><path cl